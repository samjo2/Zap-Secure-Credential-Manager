{% extends "base.html" %}
{% block title %}Account - Zap{% endblock %}
{% block content %}
<h1>Account</h1>
<p>Signed in as <strong>{{ session['username'] }}</strong>.</p>

<form method="post" action="{{ url_for('auth.change_password') }}" class="card narrow">
    <h2>Change master password</h2>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Current password
        <input type="password" name="current_password" autocomplete="current-password" required>
    </label>
    <label>New password
        <input type="password" name="new_password" autocomplete="new-password" minlength="12" required>
    </label>
    <label>Confirm new password
        <input type="password" name="confirm_password" autocomplete="new-password" required>
    </label>
    <p class="hint">Changing your password with the current one re-encrypts
    your vault key. Your credentials are kept.</p>
    <button type="submit" class="button">Change password</button>
</form>
{% endblock %}
