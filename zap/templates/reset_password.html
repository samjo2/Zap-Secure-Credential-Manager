{% extends "base.html" %}
{% block title %}Reset password - Zap{% endblock %}
{% block content %}
<h1>Choose a new master password</h1>
<form method="post" class="card narrow"
      action="{{ url_for('auth.reset_password', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>New master password
        <input type="password" name="password" id="password"
               autocomplete="new-password" minlength="12" required>
    </label>
    <div id="strength" aria-live="polite"></div>
    <label>Confirm new master password
        <input type="password" name="confirm_password" autocomplete="new-password" required>
    </label>
    <label class="checkbox warn">
        <input type="checkbox" name="confirm_purge" value="yes" required>
        I understand my stored credentials cannot be decrypted without my old
        password and will be permanently erased.
    </label>
    <button type="submit" class="button">Reset password</button>
</form>
<script src="{{ url_for('static', filename='js/strength.js') }}"></script>
{% endblock %}
